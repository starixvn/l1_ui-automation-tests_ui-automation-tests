

variables:
  GIT_CLEAN_FLAGS: none

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

docker-build:
  image: hub.lumigame.com/base/playwright:v1.24.0-focal
  tags:
    - docker-automation-test
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  rules:   
    - if: $CI_COMMIT_TAG =~ /build-image/     
  script:   
     - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
     - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  when: manual

smoketest:
  image: git3.nexdev.net:5050/l1/ui-automation-tests/ui-automation-tests
  stage: test
  tags:
    - auto-test-prod
  script:
    - npm run test --env=$ENV --game=$GAMEID
  after_script:
    - du -hs /ms-playwright/*
  retry: 1      

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results   
    when: manual
    expire_in: 1 day

