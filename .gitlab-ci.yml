variables:
  GIT_CLEAN_FLAGS: none

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

docker-build:
  image: hub.lumigame.com/base/docker:20.10.7
  tags:
    - docker-automation-test
  stage: build
  services:
    - docker:dind
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon-base/ui-automation-tests
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
  script:   
     - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
     - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  when: always

smoketest:
  image: hub.lumigame.com/pentagon-base/ui-automation-tests:latest
  stage: test
  tags:
    - auto-test-prod
  script:
    - npm run test --env=$ENV --game=$GAMEID
  after_script:
    - du -hs /ms-playwright/*
  retry: 1    
  when: always  

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results   
    when: always
    expire_in: 1 day

