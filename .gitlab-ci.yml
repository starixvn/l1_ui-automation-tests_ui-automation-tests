variables:
  GIT_CLEAN_FLAGS: none

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

docker-build:
  image: registry.nexdev.net:5050/docker/docker-engine/docker:20.10.7
  tags:
    - docker-automation-test
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY     
  script:
    - GAMEID=$(echo $CI_COMMIT_TAG | cut -d'-' -f 2)
    - echo ----- BUILD TESTS GAME $GAMEID ------
    - docker build --build-arg GAME_ID=$GAMEID --pull -t "$CI_REGISTRY_IMAGE:$GAMEID-$CI_COMMIT_REF_NAME" .
    - docker push "$CI_REGISTRY_IMAGE:$GAMEID-$CI_COMMIT_REF_NAME"
  rules:
  - if: $CI_COMMIT_TAG =~ /build/
    when: on_success
  when: manual

smoketest:
  image: git3.nexdev.net:5050/l1/ui-automation-tests/ui-automation-tests:$GAMEID-main
  stage: test
  tags:
    - auto-test-prod
  script:
    - npm run test --env=$ENV --game=$GAMEID
  after_script:
    - du -hs /ms-playwright/*
  retry: 1    
  rules:
  - if: $CI_PIPELINE_SOURCE == "pipeline"
    when: on_success
  when: manual

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results   
    when: always
    expire_in: 1 day

